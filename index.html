/* ---------- MARKER DETAIL ----------
   One marker's history across every panel, as a sheet with an inline-SVG
   trend chart. No charting library: the app stays a single self-contained
   file. */

const normLabel=s=>String(s||'').toLowerCase().replace(/[^a-z0-9äöüß]/g,'');
let mdPoints=[];   // per-dot summaries for the chart currently on screen

function pickMarkerPoint(i){
  const p=mdPoints[i], box=document.getElementById('mdPoint');
  if(!p||!box) return;
  const rangeCls=p.range==='in range'?'inrange':'outrange';
  box.innerHTML=`<b>${esc(p.date)}</b> · ${esc(p.val)}`
    +(p.range?` · <span class="${rangeCls}">${p.range}</span>`:'')
    +(p.chg?`<br><span class="md-sub">${esc(p.chg)}</span>`:'')
    +(p.qual?`<br><span class="md-sub">Reported as a limit — the exact value is unknown.</span>`:'');
  document.querySelectorAll('.md-dot').forEach((el,j)=>el.setAttribute('r',j===i?'6':'4'));
}

function refLabel(v){
  if(v.refLo!=null&&v.refHi!=null) return v.refLo+'–'+v.refHi;
  if(v.refHi!=null) return '< '+v.refHi;
  if(v.refLo!=null) return '> '+v.refLo;
  return '';
}
function inRange(v){
  if(v==null||v.v==null) return null;
  if(v.refLo!=null&&v.refHi!=null) return v.v>=v.refLo&&v.v<=v.refHi;
  if(v.refHi!=null) return v.v<=v.refHi;
  if(v.refLo!=null) return v.v>=v.refLo;
  return null;
}
function fmtPanelDate(s){
  const [y,m,d]=String(s).split('-').map(Number);
  if(!y||!m||!d) return String(s);
  return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
const fmtNum=n=>Math.abs(n)>=100?n.toFixed(0):Math.abs(n)>=10?n.toFixed(1):n.toFixed(2).replace(/0$/,'');

// PANELS is date-sorted, so readings come back chronologically. The parser's
// key already includes section and unit, which is what we want — but a lab
// that renames a section or switches units between reports would break the
// chain, so fall back to a normalised label when the key finds no history.
function collectReadings(mkKey){
  const byKey=[];
  PANELS.forEach(p=>{ const hit=p.values.find(x=>x.key===mkKey); if(hit) byKey.push({panel:p,v:hit}); });
  if(byKey.length>=2) return byKey;
  const latest=byKey.length?byKey[byKey.length-1].v:null;
  if(!latest) return byKey;
  const target=normLabel(latest.label);
  const byLabel=[];
  PANELS.forEach(p=>{ const hit=p.values.find(x=>normLabel(x.label)===target); if(hit) byLabel.push({panel:p,v:hit}); });
  return byLabel.length>byKey.length?byLabel:byKey;
}

function markerChartSVG(readings,latest){
  const num=readings.filter(r=>r.v.text==null&&isFinite(r.v.v));
  if(!num.length) return '';
  const W=320,H=180,PL=38,PR=10,PT=12,PB=24;
  const PW=W-PL-PR, PH=H-PT-PB;
  const ts=num.map(r=>{ const [y,m,d]=r.panel.date.split('-').map(Number); return new Date(y,m-1,d).getTime(); });
  const t0=Math.min(...ts), t1=Math.max(...ts);
  const xOf=t=> (t1===t0) ? PL+PW/2 : PL+(t-t0)/(t1-t0)*PW;

  const vals=num.map(r=>r.v.v);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const pad=((hi-lo)||Math.abs(hi)||1)*0.1;
  let ymin=lo-pad, ymax=hi+pad;
  // Pull the reference band in only when it is near the data; a far-off
  // bound would flatten the trend into a straight line.
  const span=ymax-ymin;
  const {refLo,refHi}=latest;
  if(refLo!=null&&refLo>ymin-span&&refLo<ymax+span){ ymin=Math.min(ymin,refLo-pad); ymax=Math.max(ymax,refLo+pad); }
  if(refHi!=null&&refHi>ymin-span&&refHi<ymax+span){ ymin=Math.min(ymin,refHi-pad); ymax=Math.max(ymax,refHi+pad); }
  if(ymax-ymin<1e-9){ ymin-=1; ymax+=1; }
  const yOf=v=>PT+(1-(v-ymin)/(ymax-ymin))*PH;

  let band='';
  if(refLo!=null||refHi!=null){
    const top=refHi!=null?yOf(Math.min(refHi,ymax)):PT;
    const bot=refLo!=null?yOf(Math.max(refLo,ymin)):PT+PH;
    if(bot>top) band=`<rect x="${PL}" y="${top}" width="${PW}" height="${bot-top}"
      fill="var(--moss)" opacity="0.10"/>`;
  }

  const pts=num.map((r,i)=>xOf(ts[i]).toFixed(1)+','+yOf(r.v.v).toFixed(1));
  const line=num.length>1
    ? `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--frost)" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>` : '';
  // Summary shown when a dot is tapped, indexed the same as the dots.
  mdPoints=num.map((r,i)=>{
    const prev=i>0?num[i-1]:null;
    let chg='';
    if(prev){
      const d=r.v.v-prev.v.v;
      chg=(Math.abs(d)<1e-9?'No change':(d>0?'▲ +'+fmtNum(d):'▼ '+fmtNum(d)))
        +' since '+fmtPanelDate(prev.panel.date);
    }
    const inR=inRange(r.v);
    return {date:fmtPanelDate(r.panel.date),
      val:(r.v.qual||'')+fmtNum(r.v.v)+(r.v.unit?' '+r.v.unit:''),
      range:inR===true?'in range':inR===false?'outside range':'',
      qual:!!r.v.qual, chg};
  });

  const dots=num.map((r,i)=>{
    const inR=inRange(r.v), col=(inR===false)?'var(--amber)':'var(--frost)';
    const [cx,cy]=[xOf(ts[i]),yOf(r.v.v)];
    // A qualifier ("<0.06") means the true value is unknown — hollow it out
    // rather than implying a precise reading.
    const dot=r.v.qual
      ? `<circle class="md-dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="var(--bg)" stroke="${col}" stroke-width="2"/>`
      : `<circle class="md-dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="${col}"/>`;
    // A 4px dot is far too small to hit on a phone, so an invisible disc
    // carries the tap.
    return dot+`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="12" fill="transparent"
      style="cursor:pointer" onclick="pickMarkerPoint(${i})"/>`;
  }).join('');

  const first=num[0].panel.date, last=num[num.length-1].panel.date;
  const dateLbls=num.length>1
    ? `<text x="${PL}" y="${H-6}" fill="var(--faint)" font-size="10">${esc(fmtPanelDate(first))}</text>
       <text x="${W-PR}" y="${H-6}" fill="var(--faint)" font-size="10" text-anchor="end">${esc(fmtPanelDate(last))}</text>`
    : `<text x="${PL+PW/2}" y="${H-6}" fill="var(--faint)" font-size="10" text-anchor="middle">${esc(fmtPanelDate(first))}</text>`;

  return `<div class="md-chart"><svg viewBox="0 0 ${W} ${H}" role="img">
    ${band}
    <line x1="${PL}" y1="${PT+PH}" x2="${W-PR}" y2="${PT+PH}" stroke="var(--line)" stroke-width="1"/>
    ${line}${dots}
    <text x="${PL-6}" y="${PT+4}" fill="var(--faint)" font-size="10" text-anchor="end">${esc(fmtNum(ymax))}</text>
    <text x="${PL-6}" y="${PT+PH}" fill="var(--faint)" font-size="10" text-anchor="end">${esc(fmtNum(ymin))}</text>
    ${dateLbls}
  </svg></div>`;
}

function markerDetailHTML(mkKey){
  const readings=collectReadings(mkKey);
  const back=`<button class="md-back" onclick="closeSheet()">‹ Back</button>`;
  if(!readings.length) return back+`<div class="md-note">No readings found for this marker.</div>`;

  const last=readings[readings.length-1], v=last.v;
  const isText=v.text!=null;
  const rl=refLabel(v), inR=inRange(v);

  // delta against the previous numeric reading
  let deltaHTML='';
  if(!isText){
    const prevNum=[...readings].slice(0,-1).reverse().find(r=>r.v.text==null&&isFinite(r.v.v));
    if(prevNum){
      const d=v.v-prevNum.v.v;
      const cls=Math.abs(d)<1e-9?'flat':(d>0?'up':'down');
      const arrow=Math.abs(d)<1e-9?'':(d>0?'▲':'▼');
      deltaHTML=`<span class="md-delta ${cls}">${arrow} ${d>0?'+':''}${fmtNum(d)}</span>`;
    }
  }

  const header=`
    <div class="md-name">${esc(v.displayName||v.label)}</div>
    <div class="md-meta">${v.unit?esc(v.unit):'no unit'}${rl?' · reference '+esc(rl):' · no reference range'}${v.section?' · '+esc(v.section):''}</div>
    <div class="md-latest">
      <span class="md-val ${isText?'':(inR===false?'outr':inR===true?'inr':'')}">${isText?esc(v.text):esc(v.qual||'')+fmtNum(v.v)}</span>
      ${!isText&&v.unit?`<span class="md-unit">${esc(v.unit)}</span>`:''}
      ${deltaHTML}
    </div>
    <div class="md-meta">Latest · ${esc(fmtPanelDate(last.panel.date))}</div>`;

  const chart=isText?'':markerChartSVG(readings,v);   // also fills mdPoints
  const pointBox=chart?`<div class="md-point" id="mdPoint">Tap a point on the chart for details.</div>`:'';
  const single=!isText&&readings.filter(r=>r.v.text==null&&isFinite(r.v.v)).length<2
    ? `<div class="md-note">A trend needs at least two panels.</div>` : '';

  const rows=[...readings].reverse().map((r,i,arr)=>{
    const nxt=arr[i+1];   // chronologically previous
    let chg='<span class="flat">—</span>';
    if(r.v.text==null&&nxt&&nxt.v.text==null&&isFinite(r.v.v)&&isFinite(nxt.v.v)){
      const d=r.v.v-nxt.v.v;
      const cls=Math.abs(d)<1e-9?'flat':(d>0?'up':'down');
      const arrow=Math.abs(d)<1e-9?'':(d>0?'▲':'▼');
      chg=`<span class="${cls}">${arrow} ${d>0?'+':''}${fmtNum(d)}</span>`;
    }
    const odd=r.v.unit!==v.unit;
    return `<div class="md-row">
      <span class="md-date">${esc(fmtPanelDate(r.panel.date))}</span>
      <span class="md-reading">${r.v.text!=null?esc(r.v.text):esc(r.v.qual||'')+fmtNum(r.v.v)}${r.v.unit?' '+esc(r.v.unit):''}${odd?'<span class="md-flag">≠ unit</span>':''}</span>
      <span class="md-chg">${r.v.text!=null?'':chg}</span>
    </div>`;
  }).join('');

  const mixed=readings.some(r=>r.v.unit!==v.unit)
    ? `<div class="md-note">≠ marks a reading the lab reported in a different unit. It is listed but not plotted as comparable.</div>` : '';

  return back+header+chart+pointBox+single+`<div class="md-sec">Readings</div>`+rows+mixed;
}

  const hasHistory=PANELS.length>1;
  const cur=(cmpA&&PANELS.find(p=>p.id===cmpA))||PANELS[PANELS.length-1];
  const prev=hasHistory?((cmpB&&PANELS.find(p=>p.id===cmpB))||PANELS[PANELS.length-2]):null;

  if(hasHistory){
    const opts=selId=>PANELS.slice().reverse().map(p=>

  } else {
    c.insertAdjacentHTML('beforeend',
      `<div class="day-sep" id="scrollAnchor">Panel · ${esc(cur.date)} · no earlier panel to compare</div>`);
  }

  let lastSection=null;
  cur.values.forEach(v=>{
    if(v.section!==lastSection){
      lastSection=v.section;
      c.insertAdjacentHTML('beforeend',`<div class="day-sep">${esc(v.section||'Other')}</div>`);
    }
    const pv=prev?prev.values.find(x=>x.key===v.key):null;
    let statusHTML='', delta='<span class="flat">—</span>';
    if(v.text!=null){
      statusHTML=`<div class="mk-sub">${esc(v.text)}</div>`;
    } else {
      if(pv&&pv.text==null&&pv.v!=null){
        const d=v.v-pv.v;
        const cls=Math.abs(d)<1e-9?'flat':(d>0?'up':'down');
        const arrow=Math.abs(d)<1e-9?'':(d>0?'▲':'▼');
        const dv=Math.abs(d)>=10?d.toFixed(0):d.toFixed(1);
        delta=`<span class="${cls}">${arrow} ${d>0?'+':''}${dv}</span>`;
      }
      let rangeLbl='', inR=null;
      if(v.refLo!=null&&v.refHi!=null){ rangeLbl=v.refLo+'–'+v.refHi; inR=v.v>=v.refLo&&v.v<=v.refHi; }
      else if(v.refHi!=null){ rangeLbl='< '+v.refHi; inR=v.v<=v.refHi; }
      else if(v.refLo!=null){ rangeLbl='> '+v.refLo; inR=v.v>=v.refLo; }
      if(rangeLbl) statusHTML=`<div class="mk-sub ${inR?'inrange':'outrange'}">${inR?'in range':'outside range'} · ${esc(rangeLbl)}${v.unit?' '+esc(v.unit):''}</div>`;

    const valTxt=v.text!=null?esc(v.text):esc(v.qual||'')+v.v;
    c.insertAdjacentHTML('beforeend',
      `<div class="mk" data-mk="${v.key}">
        <div class="mk-name">${esc(v.displayName)}
          ${statusHTML}
        </div>
        <span class="mk-val">${valTxt}${v.text==null&&v.unit?`<small>${esc(v.unit)}</small>`:''}</span>
        <span class="mk-delta">${v.text!=null?'':delta}</span>
      </div>`);
  });

  c.insertAdjacentHTML('beforeend','<div class="day-sep">Panel history</div>');
  PANELS.slice().reverse().forEach(p=>{
    c.insertAdjacentHTML('beforeend',
      `<div class="panel-row">

        </div>
      </div>`);
  });

  c.querySelectorAll('[data-bio]').forEach(b=>b.onclick=()=>{ bioNote=bioNote===b.dataset.bio?'':b.dataset.bio; render(); });
  c.querySelectorAll('[data-mk]').forEach(x=>x.onclick=()=>openMarkerDetail(x.dataset.mk));
  c.querySelectorAll('[data-pedit]').forEach(b=>b.onclick=()=>openPanelSheet(b.dataset.pedit));
  c.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{
    const i=PANELS.findIndex(p=>p.id===b.dataset.pdel);
    if(i>-1&&confirm('Delete the panel from '+PANELS[i].date+'?')){
      PANELS.splice(i,1); resetCompare(); render();
    }
  });
}

/* Shared notes + checklist renderer, used by both the task detail view and
   the event sheet. Kept in one place deliberately: two copies of the drag,
   sink-on-done and add-row behaviour would drift apart.
   `owner` is the object holding the data; `field` names its array. */
function renderChecklist(box,owner,field,onChange){
  if(!box||!owner) return;
  const list=owner[field]||(owner[field]=[]);
  const commit=()=>{ (onChange||saveAll)(); renderChecklist(box,owner,field,onChange); };

  box.innerHTML=list.map(s=>`
    <div class="sub-item${s.done?' done':''}" data-item="${s.id}">
      <button class="sub-check ${s.done?'on':''}" data-ck="${s.id}"></button>
      <input class="sub-input" value="${esc(s.title)}" data-cktitle="${s.id}" placeholder="Item">
      <button class="drag-handle" data-drag title="Reorder" aria-label="Reorder">⋮⋮</button>
      <button class="sub-del" data-ckdel="${s.id}">✕</button>
    </div>`).join('')
    +`<div class="sub-item">
        <button class="sub-check" style="visibility:hidden"></button>
        <input class="sub-input cl-add" placeholder="Add item">
      </div>`;

  box.querySelectorAll('[data-ck]').forEach(el=>el.onclick=()=>{
    const s=list.find(x=>x.id===el.dataset.ck); if(!s) return;
    s.done=!s.done;
    sinkDone(owner,field);
    commit();
  });
  box.querySelectorAll('[data-cktitle]').forEach(el=>el.oninput=()=>{
    const s=list.find(x=>x.id===el.dataset.cktitle);
    if(s){ s.title=el.value; (onChange||saveAll)(); }   // no re-render: it would drop the caret
  });
  box.querySelectorAll('[data-ckdel]').forEach(el=>el.onclick=()=>{
    const i=list.findIndex(x=>x.id===el.dataset.ckdel); if(i<0) return;
    const s=list[i];
    deleteWithUndo(s.title||'Item',
      ()=>{ list.splice(i,1); commit(); },
      ()=>{ list.splice(i,0,s); commit(); });
  });

  const add=box.querySelector('.cl-add');
  if(add) add.onkeydown=e=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const v=add.value.trim(); if(!v) return;
    list.push({id:'s'+Date.now()+Math.floor(Math.random()*1000),title:v,done:false});
    sinkDone(owner,field);
    commit();
    const nxt=box.querySelector('.cl-add'); if(nxt) nxt.focus();   // keep typing
  };

  makeReorderable(box,ids=>{
    const map={}; list.forEach(s=>map[s.id]=s);
    owner[field]=ids.map(id=>map[id]).filter(Boolean);
    commit();
  });
}
function sinkDone(owner,field){
  const l=owner[field]||[];
  owner[field]=[...l.filter(s=>!s.done),...l.filter(s=>s.done)];
}

// Binds an auto-growing notes textarea to owner[field].
function bindNotes(el,owner,field,onChange){
  if(!el||!owner) return;
  el.value=owner[field]||'';
  const grow=()=>{ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; };
  el.oninput=()=>{ owner[field]=el.value; grow(); (onChange||saveAll)(); };
  setTimeout(grow,0);
}

const countLabel=(list)=>{
  const n=(list||[]).length;
  return n?`<span class="sub-count">${list.filter(s=>s.done).length}/${n}</span>`:'';
};

function openSheet(kind,ref){
  if(activeTab==='tasks'){ kind==='edit'?openTaskDetail(ref):newTaskAndOpen(); return; }
  showSheetChrome(true);
  sheetType=sheetTypeFor(kind,ref);
  editing=kind==='edit'?ref:null;
  document.getElementById('routineFields').style.display=sheetType==='routine'?'block':'none';
  document.getElementById('suppFields').style.display=sheetType==='supp'?'block':'none';
  document.getElementById('eventFields').style.display=sheetType==='event'?'block':'none';
  document.getElementById('panelFields').style.display='none';
  document.getElementById('eatFields').style.display='none';
  document.getElementById('taskFields').style.display='none';
  document.getElementById('f-name-field').style.display='block';
  document.getElementById('f-name-label').textContent='Name';
  document.getElementById('deleteBtn').style.display=kind==='edit'?'block':'none';
  document.getElementById('saveBtn').textContent=kind==='edit'?'Save':'Add';

  const noun = sheetType==='routine'?'routine':sheetType==='supp'?'supplement':'event';
  document.getElementById('sheetTitle').textContent=(kind==='edit'?'Edit ':'Add ')+noun;
  document.getElementById('sheetHint').textContent =
    kind==='edit' ? 'Change any detail below.'
    : sheetType==='event' ? 'A one-off entry for a single day.'
    : sheetType==='supp' ? 'Add a supplement to a time block.'
    : 'Optional ones stay greyed out until you switch them on for a day.';

  if(sheetType==='routine'){
    const r=editing?ROUTINES.find(x=>x.id===editing):null;
    document.getElementById('f-name').value=r?r.title:'';
    document.getElementById('f-time').value=r?r.time:'08:00';
    document.getElementById('f-dur').value=r?r.dur:15;
    document.getElementById('f-cat').value=r?r.cat:'health';
    document.getElementById('f-date').value=r&&r.date?r.date:dk();
    setKind(r?!!r.optional:false);
    if(r&&r.date){ setMode('once'); selDows=[0,1,2,3,4,5,6]; }
    else { setMode('repeat'); selDows=r&&r.days?[...r.days]:[0,1,2,3,4,5,6]; }
    renderDows();
  } else if(sheetType==='event'){
    const r=editing?ROUTINES.find(x=>x.id===editing):null;
    document.getElementById('f-name').value=r?r.title:'';
    document.getElementById('e-date').value=r&&r.date?r.date:dk();
    document.getElementById('e-time').value=r?r.time:'09:00';
    document.getElementById('e-dur').value=r?r.dur:60;
    if(r && !r.date){ eSelDows=r.days?[...r.days]:[1,2,3,4,5,6,0]; setEMode('repeat'); }
    else { eSelDows=[1,2,3,4,5,6,0]; setEMode('once'); }
    renderEDows();
    // Edited into a draft, not the entry itself, so Cancel still discards.
    evDraft={notes:(r&&r.notes)||'', checklist:JSON.parse(JSON.stringify((r&&r.checklist)||[]))};
    const hasDesc=!!evDraft.notes||evDraft.checklist.length>0;
    document.getElementById('ev-desc').style.display=hasDesc?'block':'none';
    document.getElementById('ev-desc-add').style.display=hasDesc?'none':'block';
    if(hasDesc) bindEventDesc();
  } else {
    const sel=document.getElementById('f-block');
    sel.innerHTML=SUPP_BLOCKS.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('');
    if(editing){
      const [bid,iid]=editing.split(':');
      const it=SUPP_BLOCKS.find(b=>b.id===bid).items.find(x=>x.id===iid);
      document.getElementById('f-name').value=it.name;
      document.getElementById('f-sub').value=it.sub==='—'?'':it.sub;
      document.getElementById('f-dose').value=it.dose==='—'?'':it.dose;
      sel.value=bid;
    } else { ['f-name','f-sub','f-dose'].forEach(i=>document.getElementById(i).value=''); }
  }
  document.getElementById('overlay').classList.add('open');
}

  if(sheetType==='task'&&editing){ discardEmptyTask(editing); render(); }
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('taskDetail').style.display='none';
  editing=null;

  document.getElementById('f-name-label').textContent='Label';
  document.getElementById('f-name').value=p.label||'';
  document.getElementById('p-date').value=p.date||'';
  document.getElementById('overlay').classList.add('open');
}

function openEatSheet(){
  showSheetChrome(true);
  sheetType='eat'; editing=null;
  document.getElementById('routineFields').style.display='none';
  document.getElementById('suppFields').style.display='none';
  document.getElementById('eventFields').style.display='none';
  document.getElementById('panelFields').style.display='none';
  document.getElementById('taskFields').style.display='none';
  document.getElementById('eatFields').style.display='block';
  document.getElementById('f-name-field').style.display='none';
  document.getElementById('deleteBtn').style.display='none';
  document.getElementById('saveBtn').textContent='Save';
  document.getElementById('sheetTitle').textContent='Eating window';
  document.getElementById('sheetHint').textContent='Set when your eating window starts and how long it lasts.';
  document.getElementById('eat-start-in').value=hoursToHHMM(EAT_START);
  document.getElementById('eat-dur-in').value=EAT_END-EAT_START;
  document.getElementById('overlay').classList.add('open');
}

function saveItem(){
  if(sheetType==='panel'){
    const p=PANELS.find(x=>x.id===editing);
    if(p){
      p.label=document.getElementById('f-name').value.trim();
      const dv=document.getElementById('p-date').value;
      if(dv) p.date=dv;
      sortPanels(); resetCompare();
    }
    closeSheet(); render(); return;
  }
  if(sheetType==='eat'){
    const t=document.getElementById('eat-start-in').value;
    const dur=parseFloat(document.getElementById('eat-dur-in').value);
    if(t && isFinite(dur) && dur>0){
      const [h,m]=t.split(':').map(Number);
      EAT_START=h+m/60;
      EAT_END=Math.min(24,EAT_START+dur);
    }
    closeSheet(); render(); return;
  }
  const name=document.getElementById('f-name').value.trim();
  if(!name){ document.getElementById('f-name').focus(); return; }

  if(sheetType==='event'){
    const data={ title:name,
      time:document.getElementById('e-time').value||'09:00',
      dur:parseInt(document.getElementById('e-dur').value)||60,
      cat:'event', optional:false };
    if(eMode==='once'){
      data.date=document.getElementById('e-date').value||dk(); data.days=undefined;
    } else {
      data.date=undefined;
      data.days=eSelDows.length===7?undefined:[...eSelDows].sort((a,b)=>a-b);
    }
    data.notes=evDraft.notes||'';
    data.checklist=evDraft.checklist||[];
    if(editing) Object.assign(ROUTINES.find(r=>r.id===editing),data);
    else ROUTINES.push({id:'e'+Date.now(),...data});
    if(data.date){                                   // zum Datum springen
      const [y,m,d]=data.date.split('-').map(Number);
      viewDate=new Date(y,m-1,d); viewDate.setHours(0,0,0,0);
    }
    closeSheet(); render(); return;
  }

  if(sheetType==='routine'){
    const data={title:name,time:document.getElementById('f-time').value||'08:00',
      dur:parseInt(document.getElementById('f-dur').value)||15,
      cat:document.getElementById('f-cat').value, optional:isOptional};
    if(mode==='once'){ data.date=document.getElementById('f-date').value||dk(); data.days=undefined; }
    else { data.date=undefined; data.days=selDows.length===7?undefined:[...selDows].sort(); }
    if(editing) Object.assign(ROUTINES.find(r=>r.id===editing),data);
    else ROUTINES.push({id:'c'+Date.now(),...data});
  } else {
    const bid=document.getElementById('f-block').value;
    const data={name,sub:document.getElementById('f-sub').value.trim()||'—',
      dose:document.getElementById('f-dose').value.trim()||'—'};
    if(editing){
      const [obid,iid]=editing.split(':');
      const ob=SUPP_BLOCKS.find(b=>b.id===obid);
      const idx=ob.items.findIndex(x=>x.id===iid);
      const item={...ob.items[idx],...data};
      if(obid!==bid){ ob.items.splice(idx,1); SUPP_BLOCKS.find(b=>b.id===bid).items.push(item); }
      else ob.items[idx]=item;
    } else SUPP_BLOCKS.find(b=>b.id===bid).items.push({id:'c'+Date.now(),...data});
  }
  closeSheet(); render();
}
function deleteCurrent(){
  if(!editing) return;
  const id=editing;
  closeSheet();                       // closeSheet clears `editing`, so capture it first
  if(sheetType==='supp'){
    const [bid,iid]=id.split(':'); const b=SUPP_BLOCKS.find(x=>x.id===bid); if(!b) return;
    const i=b.items.findIndex(x=>x.id===iid); if(i<0) return;
    const it=b.items[i];
    deleteWithUndo(it.name, ()=>b.items.splice(i,1), ()=>b.items.splice(i,0,it));
  } else if(sheetType==='task'){
    const i=TASKS.findIndex(t=>t.id===id); if(i<0) return;
    const t=TASKS[i];
    deleteWithUndo(t.title, ()=>TASKS.splice(i,1), ()=>TASKS.splice(i,0,t));
  } else {
    const i=ROUTINES.findIndex(r=>r.id===id); if(i<0) return;
    const r=ROUTINES[i];
    deleteWithUndo(r.title, ()=>ROUTINES.splice(i,1), ()=>ROUTINES.splice(i,0,r));
  }
}
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeSheet(); });

/* ---------- ICS EXPORT ---------- */
const icsDate=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+
  pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';
function vevent(uid,title,time,durMin,note,onDay){
  const base=onDay||viewDate;
  const [h,m]=time.split(':').map(Number);
  const start=new Date(base); start.setHours(h,m,0,0);
  const end=new Date(start.getTime()+durMin*60000);
  return ['BEGIN:VEVENT','UID:'+uid+'-'+key(base)+'@routine','DTSTAMP:'+icsDate(new Date()),
    'DTSTART:'+icsDate(start),'DTEND:'+icsDate(end),'SUMMARY:'+title,
    ...(note?['DESCRIPTION:'+note]:[]),
    'BEGIN:VALARM','TRIGGER:-PT5M','ACTION:DISPLAY','DESCRIPTION:'+title,'END:VALARM','END:VEVENT'].join('\r\n');
}
const wrapCal=e=>['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Routine//EN','CALSCALE:GREGORIAN',
  'METHOD:PUBLISH',...e,'END:VCALENDAR'].join('\r\n');
function download(content,name,mime){
  const b=new Blob([content],{type:mime||'text/calendar;charset=utf-8'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
const exportAllRoutines=()=>download(wrapCal(activeRoutinesOn(viewDate).map(r=>vevent(r.id,r.title,r.time,r.dur))),'routine-'+dk()+'.ics');
function exportSupps(){
  const ev=SUPP_BLOCKS.filter(b=>b.items.length).map(b=>{
    const list=b.items.map(i=>i.name+' ('+i.dose+')').join(', ');
    return vevent('supp-'+b.id,'Supplements: '+b.title,b.time,10,list+(b.wait?' — '+b.wait:''));
  });
  download(wrapCal(ev),'supplements-'+dk()+'.ics');
}
function exportEverything(){
  const ev=activeRoutinesOn(viewDate).map(r=>vevent(r.id,r.title,r.time,r.dur));
  SUPP_BLOCKS.filter(b=>b.items.length).forEach(b=>ev.push(
    vevent('supp-'+b.id,'Supplements: '+b.title,b.time,10,b.items.map(i=>i.name+' ('+i.dose+')').join(', '))));
  download(wrapCal(ev),'day-'+dk()+'.ics');
}
